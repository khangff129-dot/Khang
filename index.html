<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cá Nhân</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        /* Header / Avatar */
        .header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 16px;
            margin-bottom: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            object-fit: cover;
            margin-bottom: 16px;
        }

        .name {
            font-size: 2rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .title {
            color: var(--accent);
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 12px;
        }

        .bio {
            color: var(--text-sub);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Section Cards */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 1.3rem;
            color: var(--accent);
            margin-bottom: 16px;
            border-bottom: 2px solid #334155;
            padding-bottom: 8px;
        }

        /* Skills Tags */
        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill-tag {
            background: #334155;
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.9rem;
